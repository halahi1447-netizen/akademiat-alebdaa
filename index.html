<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creativity Academy | Development Course</title>
<style>
  :root{
    --navy:#1b2a4a;
    --navy-dark:#12203a;
    --orange:#f4923a;
    --orange-dark:#e07a1f;
    --blue:#2f80ed;
    --blue-light:#eaf2ff;
    --bg1:#fef6ee;
    --bg2:#eaf2ff;
    --card:#ffffff;
    --text:#3a3f52;
    --green:#3ec776;
    --gray:#c7ccd6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    font-family:'Tahoma','Segoe UI',sans-serif;
    background:linear-gradient(160deg,var(--bg1) 0%, #fff 40%, var(--bg2) 100%);
    color:var(--text);
  }
  .blob{ position:fixed; border-radius:50%; filter:blur(6px); opacity:0.35; z-index:0; pointer-events:none;}
  header{
    position:relative; z-index:1; text-align:center; padding:40px 20px 20px;
  }
  header img{ width:110px; height:auto; border-radius:20px; box-shadow:0 10px 26px rgba(27,42,74,0.18); }
  header h1{ font-size:30px; color:var(--navy); margin:16px 0 4px; font-weight:800;}
  header p{ font-size:15px; color:var(--orange-dark); font-weight:700; margin:0;}
  header .desc{ font-size:14px; color:var(--text); font-weight:400; margin-top:10px; max-width:520px; margin-inline:auto;}

  main{ position:relative; z-index:1; max-width:1080px; margin:0 auto; padding:20px 24px 60px; }
  .section-title{ display:flex; align-items:center; gap:10px; margin:34px 0 16px; }
  .section-title h2{ font-size:19px; color:var(--navy); margin:0;}
  .section-title .line{ flex:1; height:2px; background:linear-gradient(90deg,var(--orange),transparent);}

  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:18px; }

  .card{
    background:var(--card); border-radius:20px; padding:20px; box-shadow:0 10px 24px rgba(27,42,74,0.08);
    display:flex; flex-direction:column; gap:10px; border:2px solid transparent; transition:all .2s ease;
    text-decoration:none; color:inherit;
  }
  .card.active{ cursor:pointer; }
  .card.active:hover{ transform:translateY(-4px); border-color:var(--orange); box-shadow:0 16px 30px rgba(244,146,58,0.22);}
  .card.soon{ opacity:0.6; background:repeating-linear-gradient(135deg,#fafbff,#fafbff 10px,#f3f5fa 10px,#f3f5fa 20px); }

  .card .num{
    width:38px;height:38px;border-radius:12px; display:flex;align-items:center;justify-content:center;
    font-weight:800; font-size:15px; color:#fff; background:linear-gradient(135deg,var(--blue),#1f5fc4);
  }
  .card.soon .num{ background:var(--gray); color:#fff;}
  .card .icon{ font-size:30px; }
  .card h3{ font-size:16px; color:var(--navy); margin:0; font-weight:800; line-height:1.35;}
  .card .en-title{ font-size:12px; color:#8a90a3; font-weight:600;}
  .card .status{
    margin-top:auto; font-size:12px; font-weight:700; padding:5px 12px; border-radius:20px; width:fit-content;
  }
  .card.active .status{ background:#e6fbef; color:#1c8a4d; }
  .card.soon .status{ background:#eef0f5; color:#8a90a3; }

  footer{ position:relative; z-index:1; text-align:center; padding:26px; font-size:12.5px; color:#9aa0b0; }

  @media (max-width:480px){
    header h1{ font-size:24px; }
    .grid{ grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); }
  }
</style>
</head>
